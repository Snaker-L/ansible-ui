# Release: app.py __version__ erhoehen, committen, Tag "v<version>" pushen ->
#   - Image fuer amd64 + arm64: ghcr.io/<besitzer>/ansible-ui:<version> und :latest
#   - GitHub-Release mit automatisch erzeugten Notizen (daran erkennt die Oberflaeche ein Update)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus app.py (muss zum Tag passen)
        id: v
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu __version__ $v"; exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Name (Kleinbuchstaben)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.description=Ansible-UI - deutsche Weboberflaeche fuer Ansible
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub-Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Ansible-UI ${{ steps.v.outputs.version }}" --generate-notes --verify-tag
